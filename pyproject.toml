[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "soda-forecast"
version = "0.1.0"
description = "Production-grade soda demand forecasting"
requires-python = ">=3.12"

dependencies = [
  "pandas",
  "numpy",
  "scikit-learn",
  "lightgbm",
  "xgboost",
  "optuna",
  "statsmodels",
  "linearmodels",
  "joblib",
  "pyyaml",
  "fastapi",
  "uvicorn"
]

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["soda_forecast"]